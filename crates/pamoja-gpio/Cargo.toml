[package]
name = "pamoja-gpio"
description = "On-board bus addressing and pin logic for pamoja: I2C 7-bit and 10-bit address-frame encoding (NXP UM10204) with reserved-range checks, the four SPI clock modes from CPOL/CPHA, and a GPIO pin model with active-high/active-low logical levels, no_std and allocation-free. The addressing-and-mode half ahead of the GPIO/I2C/SPI driver."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
# The switch and contact drivers over embedded-hal pins, which implement the core
# Actuator and Sensor traits. The pin model needs nothing and builds with the feature
# off.
default = ["embedded-hal"]
embedded-hal = ["dep:embedded-hal", "dep:pamoja-core"]
std = ["embedded-hal", "pamoja-core/std"]
# Opening a line on a Linux board through the GPIO character device backend of pamoja-hal.
# Every other platform builds it and reports that no line opens there.
linux = ["std", "dep:pamoja-hal", "pamoja-hal/linux"]

[dependencies]
embedded-hal = { version = "1.0", optional = true }
pamoja-core = { path = "../pamoja-core", version = "0.2.0", default-features = false, optional = true }
pamoja-hal = { path = "../pamoja-hal", version = "0.2.0", default-features = false, optional = true }

[dev-dependencies]
pamoja-hal = { path = "../pamoja-hal", features = ["alloc"] }

[lints]
workspace = true
