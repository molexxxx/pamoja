[package]
name = "pamoja-profile"
description = "Named, ready-to-run device profiles for pamoja: assemble a sensor, actuator, transport, codec, and power schedule into a working node, or run one from a site's wiring file with pamoja-node."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[features]
# A profile is always serializable; the `json` loader is opt-in but on by default.
default = ["json"]
json = ["dep:serde_json"]
# The stock runner, `pamoja-node`, which runs a profile from a wiring file: the drivers,
# the Linux buses and GPIO lines, an MQTT client, and a runtime to wait on.
runner = [
    "json",
    "pamoja-codec/json",
    "dep:pamoja-gpio",
    "dep:pamoja-hal",
    "dep:pamoja-mqtt",
    "dep:pamoja-sensors",
    "dep:tokio",
    "tokio/rt-multi-thread",
    "tokio/macros",
    "tokio/time",
    "tokio/signal",
]

[[bin]]
name = "pamoja-node"
path = "src/bin/pamoja-node.rs"
required-features = ["runner"]

[[test]]
name = "runner"
required-features = ["runner"]

[dependencies]
pamoja-core = { workspace = true }
# Only the Codec trait is used in the node's signatures, so the concrete codecs
# (and their serde backends) stay out of this crate's own dependency tree.
pamoja-codec = { path = "../pamoja-codec", version = "0.2.0", default-features = false }
# Only the always-on control helpers (Thermostat, Depletion) are used here, so the
# kit's default `geo` feature and its libm dependency stay out of this crate's tree.
pamoja-kit = { path = "../pamoja-kit", version = "0.2.0", default-features = false }
pamoja-power = { path = "../pamoja-power", version = "0.2.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
pamoja-gpio = { path = "../pamoja-gpio", version = "0.2.0", features = ["std"], optional = true }
pamoja-hal = { path = "../pamoja-hal", version = "0.2.0", features = ["std", "linux"], optional = true }
pamoja-mqtt = { path = "../pamoja-mqtt", version = "0.2.0", optional = true }
pamoja-sensors = { path = "../pamoja-sensors", version = "0.2.0", features = ["std", "linux"], optional = true }
tokio = { version = "1", default-features = false, optional = true }

[dev-dependencies]
# The tests and doctests publish real readings, so they pull in the CBOR codec and
# the in-process loopback transport.
pamoja-codec = { path = "../pamoja-codec" }
pamoja-loopback = { path = "../pamoja-loopback" }
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }

[lints]
workspace = true
