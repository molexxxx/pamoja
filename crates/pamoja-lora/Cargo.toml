[package]
name = "pamoja-lora"
description = "LoRa link math for pamoja: exact time-on-air and duty-cycle off-time, so a long-range node stays within regulations and budgets its power, no_std and allocation-free."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = ["regions"]
# Every published channel plan. A bare-metal build selects only its own region,
# because a device operates in one and flash is the scarcest thing it has.
regions = ["eu868", "us915", "eu433", "au915", "cn470", "as923", "kr920", "in865", "ru864"]
eu868 = []
us915 = []
eu433 = []
au915 = []
cn470 = []
as923 = []
kr920 = []
in865 = []
ru864 = []
