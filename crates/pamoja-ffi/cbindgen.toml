language = "C"
pragma_once = true
cpp_compat = true
documentation = true
documentation_style = "c99"
style = "type"
header = """/* pamoja C ABI.
 *
 * An enum the caller passes in, as an argument or as a field of a struct, must hold one of
 * the values the enum declares. The library reads it as one of those values, and any other
 * value is undefined behavior. */"""
autogen_warning = "/* Generated by cbindgen from crates/pamoja-ffi. Do not edit by hand; run `cargo build -p pamoja-ffi` to regenerate. */"

[parse]
# Only the curated surface in this crate is exported; core and capability types
# stay internal and are reached through the opaque handles defined here.
parse_deps = false

[enum]
prefix_with_name = true

[export]
item_types = ["constants", "enums", "structs", "opaque", "functions"]
