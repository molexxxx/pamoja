[package]
name = "pamoja-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Curated C ABI surface over the pamoja device SDK, for C, C++, and .NET."

[lib]
# cdylib is loaded by .NET (P/Invoke) and any dynamically linked C/C++ host;
# staticlib serves C/C++ projects that link statically; lib lets the build script
# and tests use the crate normally.
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = [
    "mqtt",
    "security",
    "codec",
    "kit",
    "serial",
    "modbus",
    "can",
    "gpio",
    "sensors",
    "actuators",
    "lora",
    "regions",
    "lorawan",
    "mavlink",
    "mesh",
    "routing",
    "audit",
    "session",
    "update",
    "power",
    "telemetry",
    "coap",
    "loopback",
    "sync",
    "ladder",
    "bus",
    "sim",
    "profile",
    "ros2",
    "zenoh",
]
# Each capability is a feature, so a host that needs only some of them can build a
# smaller library without reshaping the code.
# The async capabilities share one Tokio runtime, hosted in lib.rs.
runtime = ["dep:tokio"]
mqtt = ["dep:pamoja-mqtt", "runtime"]
coap = ["dep:pamoja-coap", "runtime"]
loopback = ["dep:pamoja-loopback", "runtime"]
sync = ["dep:pamoja-sync", "runtime"]
# A ladder buffers into a store, so it carries the sync stores with it.
ladder = ["dep:pamoja-ladder", "sync", "runtime"]
bus = ["dep:pamoja-bus", "runtime"]
# The simulated robot moves in the kit pose and twist types.
sim = ["dep:pamoja-sim", "kit", "runtime"]
security = ["dep:pamoja-security"]
codec = ["dep:pamoja-codec"]
kit = ["dep:pamoja-kit"]
serial = ["dep:pamoja-serial"]
modbus = ["dep:pamoja-modbus"]
can = ["dep:pamoja-can"]
gpio = ["dep:pamoja-gpio"]
sensors = ["dep:pamoja-sensors"]
actuators = ["dep:pamoja-actuators"]
lora = ["dep:pamoja-lora", "pamoja-lora/alloc"]
# The channel plans, mirroring how pamoja-lora selects them. A slim build takes
# only the bands its devices operate in, as `lora,eu868` would; the default set
# carries them all.
regions = ["eu868", "us915", "eu433", "au915", "cn470", "as923", "kr920", "in865", "ru864"]
eu868 = ["pamoja-lora?/eu868"]
us915 = ["pamoja-lora?/us915"]
eu433 = ["pamoja-lora?/eu433"]
au915 = ["pamoja-lora?/au915"]
cn470 = ["pamoja-lora?/cn470"]
as923 = ["pamoja-lora?/as923"]
kr920 = ["pamoja-lora?/kr920"]
in865 = ["pamoja-lora?/in865"]
ru864 = ["pamoja-lora?/ru864"]
lorawan = ["dep:pamoja-lorawan"]
# The MAVLink wire layer; the vehicle model and its live drivers stay Rust-only.
mavlink = ["dep:pamoja-mavlink"]
mesh = ["dep:pamoja-mesh"]
routing = ["dep:pamoja-routing"]
audit = ["dep:pamoja-audit", "security"]
session = ["dep:pamoja-session"]
update = ["dep:pamoja-update", "security"]
power = ["dep:pamoja-power"]
telemetry = ["dep:pamoja-telemetry"]
# A profile assembles a control policy over the kit helpers and a power schedule.
profile = ["dep:pamoja-profile", "kit", "power"]
# Only the naming and encoding rules cross; the live bridges stay Rust-only.
ros2 = ["dep:pamoja-ros2"]
zenoh = ["dep:pamoja-zenoh"]

[dependencies]
pamoja-core.workspace = true
pamoja-mqtt = { workspace = true, optional = true }
pamoja-kit = { workspace = true, optional = true }
pamoja-security = { path = "../pamoja-security", version = "0.1.14", optional = true }
pamoja-codec = { path = "../pamoja-codec", version = "0.1.14", optional = true }
pamoja-serial = { path = "../pamoja-serial", version = "0.1.14", optional = true }
pamoja-modbus = { path = "../pamoja-modbus", version = "0.1.14", optional = true }
pamoja-can = { path = "../pamoja-can", version = "0.1.14", optional = true }
pamoja-gpio = { path = "../pamoja-gpio", version = "0.1.14", optional = true }
pamoja-sensors = { path = "../pamoja-sensors", version = "0.1.14", optional = true }
pamoja-actuators = { path = "../pamoja-actuators", version = "0.1.14", optional = true }
# Regions are selected through this crate's own features, so the default set is
# turned off here; leaving it on would carry every channel plan into a build
# that asked for one.
pamoja-lora = { path = "../pamoja-lora", version = "0.1.14", default-features = false, optional = true }
pamoja-lorawan = { path = "../pamoja-lorawan", version = "0.1.14", optional = true }
# Default features off: the wire core is what crosses, not the tokio drivers.
pamoja-mavlink = { path = "../pamoja-mavlink", version = "0.1.14", default-features = false, optional = true }
pamoja-mesh = { path = "../pamoja-mesh", version = "0.1.14", features = ["alloc"], optional = true }
pamoja-routing = { path = "../pamoja-routing", version = "0.1.14", features = ["alloc"], optional = true }
pamoja-audit = { path = "../pamoja-audit", version = "0.1.14", optional = true }
pamoja-session = { path = "../pamoja-session", version = "0.1.14", optional = true }
pamoja-update = { path = "../pamoja-update", version = "0.1.14", optional = true }
pamoja-power = { path = "../pamoja-power", version = "0.1.14", optional = true }
pamoja-telemetry = { path = "../pamoja-telemetry", version = "0.1.14", optional = true }
pamoja-coap = { path = "../pamoja-coap", version = "0.1.14", optional = true }
pamoja-loopback = { path = "../pamoja-loopback", version = "0.1.14", optional = true }
pamoja-sync = { path = "../pamoja-sync", version = "0.1.14", optional = true }
pamoja-ladder = { path = "../pamoja-ladder", version = "0.1.14", optional = true }
pamoja-bus = { path = "../pamoja-bus", version = "0.1.14", optional = true }
pamoja-sim = { path = "../pamoja-sim", version = "0.1.14", optional = true }
pamoja-profile = { path = "../pamoja-profile", version = "0.1.14", optional = true }
pamoja-ros2 = { path = "../pamoja-ros2", version = "0.1.14", optional = true }
pamoja-zenoh = { path = "../pamoja-zenoh", version = "0.1.14", optional = true }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread"], optional = true }

[dev-dependencies]
# The update tests describe a release by its digest, which is what a manifest
# carries, so they need the same hash the crate uses.
sha2 = { version = "0.11", default-features = false }

[build-dependencies]
cbindgen = { version = "0.29", default-features = false }

[lints]
workspace = true
