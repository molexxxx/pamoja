[package]
name = "pamoja-serial"
description = "Serial-line packet framing for pamoja: SLIP (RFC 1055) and COBS byte-stuffing with streaming frame decoders, so a raw UART byte stream carries discrete, self-delimiting packets to and from motor controllers, GPS, and LiDAR, no_std and allocation-free. The framing half ahead of the serial driver."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[dev-dependencies]
# Property tests feed the SLIP and COBS decoders arbitrary bytes: they must never
# panic on hostile input, and every payload must survive an encode/decode round trip.
proptest = "1"

