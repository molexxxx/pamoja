[package]
name = "pamoja-actuators"
description = "Actuator drivers for pamoja: the NXP PCA9685 16-channel PWM controller for servos, LEDs, and valves (its registers, the frequency-to-prescale formula, 12-bit channel words, a driver over embedded-hal I2C, and a simulated part that keeps its datasheet's rules), and stepper motors (wave, full-step, and half-step coil sequencing, with drivers for four coil lines or a step and direction pair). Encoded against the manufacturer datasheets, no_std and allocation-free."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
# The drivers, which reach a part over an embedded-hal bus or pins and implement the
# core Actuator trait. The encode half needs nothing and builds with the feature off.
default = ["embedded-hal"]
embedded-hal = ["dep:embedded-hal", "dep:pamoja-core", "dep:pamoja-hal"]
std = ["embedded-hal", "pamoja-core/std", "pamoja-hal/std"]

[dependencies]
embedded-hal = { version = "1.0", optional = true }
pamoja-core = { path = "../pamoja-core", version = "0.1.18", default-features = false, optional = true }
pamoja-hal = { path = "../pamoja-hal", version = "0.1.18", default-features = false, optional = true }

[dev-dependencies]
pamoja-hal = { path = "../pamoja-hal", features = ["alloc"] }

[lints]
workspace = true
