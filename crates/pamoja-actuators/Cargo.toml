[package]
name = "pamoja-actuators"
description = "Concrete actuator drivers for pamoja: the command-encode half of common parts - the PCA9685 16-channel PWM/servo/LED controller (mode and prescale registers, the frequency-to-prescale formula, and 12-bit on/off channel words) and stepper-motor coil sequencing (wave, full-step, and half-step drive plus a step/direction position model) - turning a desired output into the bytes and steps a driver applies against the manufacturer datasheet, no_std and allocation-free. The command-encode half ahead of the bus driver."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
# The drivers, which reach a part over an embedded-hal bus or pins and implement the
# core Actuator trait. The encode half needs nothing and builds with the feature off.
default = ["embedded-hal"]
embedded-hal = ["dep:embedded-hal", "dep:pamoja-core", "dep:pamoja-hal"]
std = ["embedded-hal", "pamoja-core/std", "pamoja-hal/std"]

[dependencies]
embedded-hal = { version = "1.0", optional = true }
pamoja-core = { path = "../pamoja-core", version = "0.1.17", default-features = false, optional = true }
pamoja-hal = { path = "../pamoja-hal", version = "0.1.17", default-features = false, optional = true }

[dev-dependencies]
pamoja-hal = { path = "../pamoja-hal", features = ["alloc"] }

[lints]
workspace = true
