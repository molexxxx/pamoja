[package]
name = "pamoja-sensors"
description = "Concrete sensor drivers for pamoja: the decode-and-configure half of common parts - BME280 and BMP280 (Bosch compensation), DS18B20 1-Wire thermometer (datasheet temperature table + Maxim CRC-8), INA219 and INA226 current/voltage/power monitors (TI calibration math), ADS1115 ADC (config register and full-scale conversion), SHT3x and SCD4x (Sensirion linear formulas, command tables, and CRC-8), TMP117 and HDC1080 thermometers and hygrometers, and the OPT3001 ambient light sensor - each turning raw register bytes into physical readings exactly as the manufacturer datasheet specifies, no_std and allocation-free. The decode half ahead of the bus driver."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
# The drivers, which reach a part over an embedded-hal bus and implement the core
# Sensor trait. The decode half needs nothing and builds with the feature off.
default = ["embedded-hal"]
embedded-hal = ["dep:embedded-hal", "dep:pamoja-core", "dep:pamoja-hal"]
std = ["embedded-hal", "pamoja-core/std", "pamoja-hal/std"]
# The Linux kernel's 1-Wire thermometer files, read as a Sensor; see `ds18b20::linux`.
linux = ["std"]

[dependencies]
embedded-hal = { version = "1.0", optional = true }
pamoja-core = { path = "../pamoja-core", version = "0.1.17", default-features = false, optional = true }
pamoja-hal = { path = "../pamoja-hal", version = "0.1.17", default-features = false, optional = true }

[dev-dependencies]
pamoja-hal = { path = "../pamoja-hal", features = ["alloc"] }

[lints]
workspace = true
