[package]
name = "pamoja-gateway"
description = "LoRaWAN gateway protocols for pamoja: the Semtech UDP packet forwarder protocol and the LoRa Basics Station protocol, both sides of each, the network side of a single site that admits a join and answers an uplink, and a bridge from the radio the nodes are on to the link that leaves the site."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[features]
default = ["network"]
# The single-site network side: admit a join, read an uplink, and answer it in a
# receive window. It carries no sockets, so it binds and tests like the codec does.
network = ["dep:pamoja-lorawan"]
# Carrying messages between a LoRa radio and an upstream link. Both are pamoja
# transports and one task drives them, which is why this pulls a runtime timer.
bridge = ["dep:pamoja-core", "dep:tokio", "pamoja-core/std"]
# A gateway that drives a concentrator and forwards what it hears, over either upstream.
# It reaches a real bus through the Linux backends, so it is off by default and never enters
# the graph a caller gets for the codecs alone. Taking the station client with it brings a
# websocket stack along, which is why that stays true: a caller who wants the message layer
# alone never asks for this.
daemon = [
    "dep:pamoja-radios",
    "pamoja-radios/linux",
    "dep:embedded-hal",
    "dep:tokio",
    "tokio/rt-multi-thread",
    "tokio/macros",
    "tokio/net",
    "network",
    "station-client",
]
# The live Basics Station client: the discovery request and the muxs websocket. Off by
# default so the message layer stays dependency-free and binds like the codec does, and so
# the audited default graph never pulls a websocket and TLS stack.
station-client = [
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:tokio",
    "tokio/rt",
    "tokio/net",
]

[dependencies]
# The link a datarate identifier names is the same one the airtime and range math takes,
# so a forwarded packet and its budget are described by one type.
# A network holds the band it runs in rather than borrowing a table elsewhere, which is
# what the owned plan is for; the published regions themselves stay out of the build.
pamoja-lora = { path = "../pamoja-lora", version = "0.1.18", default-features = false, features = [
    "alloc",
] }
# The protocol's payload is a JSON object, built and read field by field so a datagram
# from a gateway in the field is refused with the name of what is wrong with it.
serde_json = "1"
# A join request and a data frame are read with the same crate a device builds them
# with, so both ends of a session agree by construction rather than by agreement.
pamoja-lorawan = { path = "../pamoja-lorawan", version = "0.1.18", optional = true }
# The concentrator the daemon drives. A gateway is the only thing here that touches a
# radio, so this stays optional and takes the publish order with it.
pamoja-radios = { path = "../pamoja-radios", version = "0.1.18", optional = true }
# The bus traits the bring-up is written against, so it drives a concentrator on a scripted
# bus in a test and on a real one in the daemon without knowing which it has.
embedded-hal = { version = "1.0", optional = true }
# A bridge moves topics between two pamoja transports, so it speaks the core traits.
pamoja-core = { path = "../pamoja-core", version = "0.1.18", default-features = false, optional = true }
# The timer a bridge polls its radio on, and the runtime the station client connects with.
tokio = { version = "1", default-features = false, features = ["time", "macros"], optional = true }
# The Basics Station protocol runs over a websocket. TLS stays off here: a station reaches
# its network server over a private link or a tunnel in this test, and pulling the rustls
# stack into the shipped graph is what pamoja-mqtt deliberately avoids.
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "connect",
    "handshake",
], optional = true }
# The websocket is a sink and a stream, and the crate re-exports only tungstenite itself, so
# the two extension traits come from here rather than through a transitive path.
futures-util = { version = "0.3", default-features = false, features = [
    "sink",
], optional = true }

[[bin]]
name = "pamoja-gateway"
path = "src/bin/pamoja-gateway.rs"
required-features = ["daemon"]

[dev-dependencies]
# The tests and the guide examples need a published band to answer in, while the crate
# itself stays region-free: a network is built on whatever plan the caller holds.
pamoja-lora = { path = "../pamoja-lora", features = ["eu868"] }
# The scripted bus the bring-up is walked against, so the order a concentrator is started
# in is checked with no board present.
pamoja-hal = { path = "../pamoja-hal", features = ["alloc"] }
# Both sides of a bridge in a test are the in-process broker, so a pass can be driven and
# read without a radio, a socket, or a clock.
pamoja-loopback = { path = "../pamoja-loopback", version = "0.1.18" }
tokio = { version = "1", default-features = false, features = [
    "macros",
    "net",
    "rt",
    "time",
] }

[lints]
workspace = true
