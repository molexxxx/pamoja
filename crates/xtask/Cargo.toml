[package]
name = "xtask"
description = "Build, codegen, and release orchestration for the pamoja workspace."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
# The dashboard i18n check parses the per-locale JSON bundles and gzips them to enforce
# the per-locale footprint budget.
serde_json = { version = "1", features = ["preserve_order"] }
flate2 = "1"
# The docs task parses a crate's source to generate scoped Markdown API docs from its
# rustdoc comments.
syn = { version = "3", features = ["full", "parsing", "printing", "extra-traits"] }
quote = "1"
# The version task rewrites every manifest in place, keeping comments and layout.
toml_edit = "0.25"

[lints]
workspace = true
