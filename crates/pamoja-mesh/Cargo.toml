[package]
name = "pamoja-mesh"
description = "Mesh packet framing for pamoja: an addressed, hop-limited, CRC-checked frame for cheap local and mesh radio (ESP-NOW and nRF24 style), with the relay and duplicate-suppression primitives that turn it into a flooding mesh, no_std and allocation-free. The framing half ahead of the radio driver."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[dev-dependencies]
# Property tests feed the frame parser arbitrary bytes off the radio boundary: it must
# never panic on hostile input, and every built frame must survive a parse round trip.
proptest = "1"

[features]
default = []
# A runtime-sized duplicate cache, for a relay or a language binding that cannot fix its
# capacity at compile time. Off by default so a bare-metal build stays allocation-free.
alloc = []

[lints]
workspace = true
