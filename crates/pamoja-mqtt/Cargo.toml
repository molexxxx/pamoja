[package]
name = "pamoja-mqtt"
description = "MQTT transport for the pamoja device SDK, built on rumqttc."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
pamoja-core = { workspace = true }
# Default features pull in the rustls TLS stack, which this crate does not use;
# plain TCP is the only transport it drives today.
rumqttc = { version = "0.25", default-features = false }
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# The embedded test broker; its default features pull the rustls TLS listener, which
# the round-trip test does not use (it connects over plain TCP), so turn them off to
# keep the rustls-webpki stack out of the tree entirely.
rumqttd = { version = "0.20", default-features = false }
