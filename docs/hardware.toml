# The hardware reference: the parts the drivers were written against, the buses and
# protocols the crates implement, the radios they budget airtime for, and the boards this is
# built and tested on. `cargo xtask docs` renders docs/hardware.md from this file and fails
# if a driver module or a LoRaWAN channel plan has no entry here. `cargo xtask links` fetches
# every `source`.
#
# Every figure in `specs` comes from the one document in `source`, which is the
# manufacturer's own datasheet or the standard that defines the thing. No distributor
# listings, no datasheet mirrors, no tutorial sites. `cost` is one of five coarse bands for a
# typical breakout module or board in USD, or "not applicable" for a bus or a specification;
# it is not a quote. `buy` lists a few product pages for a part, the cheapest reputable
# option first, each with the price the page listed on the day in `checked`; a line with
# `verified = false` took its price from a listing of the page, since that vendor refuses
# scripted readers. Those pages are checked by hand, not by `cargo xtask links`.

[[group]]
key = "sensors"
title = "Sensors"
intent = "Parts pamoja decodes byte for byte, each with a driver written from the datasheet linked beside it."

[[group]]
key = "actuators"
title = "Actuators"
intent = "Parts pamoja drives: a PWM generator for servos, and the step-and-direction carriers a stepper sequence walks."

[[group]]
key = "buses"
title = "Buses and field protocols"
intent = "The wires between a gateway and the parts above, and the framing each one carries."

[[group]]
key = "radios"
title = "Radios and long-range links"
intent = "Reaching a network that is not there: the transceivers, the channel plans they must obey, and the short-range meshes."

[[group]]
key = "antennas"
title = "Antennas, cables and protection"
intent = "What stands between a radio and the air: the antenna, the feed line and pigtail that reach it, and the arrestor on the mast."

[[group]]
key = "targets"
title = "Boards, targets and autopilots"
intent = "Where pamoja itself runs, and what it has been built and tested against."

