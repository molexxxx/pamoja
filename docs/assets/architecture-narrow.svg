  <text x="44" y="1556" font-family="Archivo, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#141414">Transport, Device, Sensor, Actuator, Store, and the event bus</text>
  <text x="44" y="1573" font-family="Archivo, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#585856">no_std, so it runs on a microcontroller</text>
  <text x="44" y="1590" font-family="Archivo, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#0f5f56">The names set in green build on it; the rest are pure logic with no dependency.</text>
  <text x="16" y="1642" font-family="Archivo, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#585856">A chapter's package brings its capabilities with it. Everything</text>
