  <text x="52" y="718" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#ffb627">The names in amber build on it; the rest are pure logic with no dependency.</text>
  <text x="24" y="770" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#95a7be">A chapter's package brings its capabilities with it. Everything at once: npm install pamoja, pip install pamoja, dotnet add package Pamoja, or cargo add pamoja.</text>
