# The standards register: every published specification pamoja implements, the document that
# defines it, and the test in this repository that pins the implementation to that document's
# own published vectors. `cargo xtask docs` renders docs/about/standards.md from this file and
# `cargo xtask links` fetches every `url`, so a specification that moves takes the build with
# it rather than sitting on the page looking authoritative.
#
# `chapter` is one of the capability chapters in docs/capabilities.toml, so a row points at the
# crates that implement it. `designation` is the document as its publisher writes it, including
# the revision where the publisher versions one. `evidence` is the file holding the test that
# asserts the document's own reference vector, and `at` is text from the line to link, usually
# the test's `fn` line; the link follows that text wherever edits move it, and `cargo xtask
# docs --check` fails when it is on no line of the file or on more than one. `anchor` says what
# that test pins:
#   vector    the specification's published test vector or worked example
#   rule      the specification's own constants, bit layout or equation, asserted directly
#   interop   a live third-party implementation the test talks to
#   internal  a round trip only, with no external vector to pin against

[[group]]
chapter = "trust"
title = "Cryptography"
intent = "The primitives under device identity, the secured session, and signed updates."

[[group]]
chapter = "identity"
title = "Identity and signing"
intent = "What names a device and what proves a message came from it."

[[group]]
chapter = "codecs"
title = "Encodings"
intent = "The wire formats readings and manifests are written in."

[[group]]
chapter = "field-io"
title = "Field I/O"
intent = "The buses and framings that reach a part on the end of a wire."

[[group]]
chapter = "sensing"
title = "Sensors and actuators"
intent = "Parts decoded byte for byte, each from the manufacturer's own datasheet."

[[group]]
chapter = "radio"
title = "Radio, mesh and gateways"
intent = "Reaching a network that is not there, and the rules a regulator sets for doing it."

[[group]]
chapter = "mavlink"
title = "Drones"
intent = "The protocol a ground station and a flight controller speak."

[[group]]
chapter = "profiles"
title = "Robotics"
intent = "Naming, typing and carrying messages the way ROS 2 and Zenoh do."

[[group]]
chapter = "transports"
title = "Messaging"
intent = "The protocols a node speaks to a broker or a server."


