# The capability map: every crate, binding module, and .NET type, grouped into the
# chapters the guides follow. `cargo xtask docs` renders the tables in the READMEs
# and the site from this file and fails if it disagrees with the code: every library
# crate must be claimed exactly once, the node keys must match the packages under
# bindings/node/packages (or be "core" for a surface the engine carries itself), the
# python keys must match the
# package exports and modules, and every dotnet name must be a declared type.

[[chapter]]
key = "identity"
title = "Identity"
intent = "Signing a payload and checking it, the way a gateway verifies a reading."

[[chapter]]
key = "codecs"
title = "Codecs"
intent = "Moving a document to the compact form a metered link should carry, and back."

[[chapter]]
key = "helpers"
title = "Helpers"
intent = "The helper math a field node runs between reading a sensor and acting on it."

[[chapter]]
key = "field-io"
title = "Field I/O"
intent = "The wires a gateway actually has: framed serial packets, an RS485 request and the reply it draws, a CAN frame, and the address a chip answers on."

[[chapter]]
key = "sensing"
title = "Sensing and actuation"
intent = "The parts wired to a board: a thermometer that checks its own bytes, a servo pulse, and a stepper walking its coils."

[[chapter]]
key = "radio"
title = "Radio and reach"
intent = "Budgeting airtime, framing a mesh packet, routing it, and securing a LoRaWAN uplink: everything a node needs to reach a network it cannot see."

[[chapter]]
key = "mavlink"
title = "MAVLink"
intent = "Talking to an autopilot: framing a message, reading it back off a link that splits and garbles it, proving a signed frame came from who it claims, and moving a plan across one frame at a time."

[[chapter]]
key = "trust"
title = "Trust and operation"
intent = "Proving what a node did, saying it in confidence, fixing it in the field, and deciding how often it can afford to do any of that."

[[chapter]]
key = "transports"
title = "Transports and testing"
intent = "Reaching the network when no single link always works, and testing all of it with nothing plugged in."

[[chapter]]
key = "profiles"
title = "Profiles and robotics"
intent = "A node instantiated by name with its policy and schedule, and the naming and encoding rules a robot's topics follow, with no ROS 2 or Zenoh installed."

[[capability]]
key = "security"
chapter = "identity"
title = "Device identity"
summary = "ed25519 device identity: sign a reading and verify it, so a gateway can prove it is authentic"
crates = ["pamoja-security"]
node = "security"
python = "security"
dotnet = ["DeviceIdentity"]

