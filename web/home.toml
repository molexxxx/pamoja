[[scenario]]
key = "robot"
group = "robotics"
tab = "Rover"
eyebrow = "Mobile rover · waypoint patrol"
title = "Follow the path. Watch the wheels. Hold on obstacle."
body = "The rover chases a carrot along its route while odometry turns wheel motion into a live pose, with no GPS. A watchdog and an obstacle stop cut motion in milliseconds, and every <code>cmd_vel</code> leaves as a ROS 2 Twist on a Zenoh key any robot on the fleet already understands."
