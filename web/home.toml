[hero]
eyebrow = "an open SDK for IoT, robotics, and drones"
title = ["One core.", "Every language.", "For the devices that", "change lives."]
lead = "pamoja runs on a two-dollar microcontroller, on a solar panel, over an intermittent radio link, so connected devices can reach the farms, clinics, and disaster zones that every other stack quietly leaves out."

# Where it runs: six field scenarios and three robots, each played by a console in
# web/js/consoles.js under the same key.

[[scenario]]
key = "farm"
group = "field"
tab = "Farm"
eyebrow = "Drip controller · RS485 probes · LoRa uplink"
title = "Water, only when the soil asks for it."
body = "A drip controller reads soil moisture from RS485 probes down a long cable, watches a well's level, and opens the valve only when it should, then duty-cycles back to sleep on a small solar panel until the next cycle. One node, a whole season, unattended."
crates = ["pamoja-modbus", "pamoja-lora", "pamoja-kit", "pamoja-power", "pamoja-sync", "pamoja-profile"]
# What the node reads, for the figure a reader gets before any script runs. The console in
# web/js/consoles.js takes the figure over and moves these; they are one node's opening
# state, not a measurement.
readings = [
  { label = "Soil moisture", value = "34", unit = "%" },
  { label = "Well level", value = "60", unit = "%" },
  { label = "Drip valve", value = "Open", unit = "" },
  { label = "Battery", value = "4.06", unit = "V" },
  { label = "Link", value = "LoRa -87", unit = "dBm" },
]

[[scenario]]
key = "clinic"
group = "field"
tab = "Clinic"
eyebrow = "Cold chain monitor · NB-IoT · signed log"
title = "A health post that keeps watch when no one can."
body = "A solar-run clinic tracks the things it cannot afford to lose, the power to the ward, the oxygen on the shelf, the cold chain for medicines, and writes each reading into a tamper-evident log. Drop the link for days and nothing is lost; when it returns, the record uploads intact."
crates = ["pamoja-telemetry", "pamoja-security", "pamoja-audit", "pamoja-sync", "pamoja-power", "pamoja-profile"]
readings = [
  { label = "Fridge temp", value = "4.2", unit = "°C" },
  { label = "Ward power", value = "90", unit = "%" },
  { label = "Oxygen stock", value = "74", unit = "%" },
  { label = "Uplink", value = "Synced", unit = "" },
  { label = "Link", value = "NB-IoT -102", unit = "dBm" },
]

[[scenario]]
key = "water"
group = "field"
tab = "Water"
eyebrow = "Handpump meter · LoRa · store and forward"
title = "The handpump that says when it is failing."
body = "A sensor on the well watches the water level and the flow through the pump, logging every draw, so a community, and the people who fund the repair, can see a pump weakening before it fails, not weeks after the queue has already given up on it."
crates = ["pamoja-modbus", "pamoja-kit", "pamoja-audit", "pamoja-sync", "pamoja-lora", "pamoja-profile"]
readings = [
  { label = "Flow rate", value = "0", unit = "L/min" },
  { label = "Well level", value = "60", unit = "%" },
  { label = "Storage tank", value = "40", unit = "%" },
  { label = "Pump health", value = "Nominal", unit = "" },
  { label = "Link", value = "LoRa -91", unit = "dBm" },
]

[[scenario]]
key = "conservation"
group = "field"
tab = "Reserve"
eyebrow = "Acoustic relay · mesh · solar"
title = "Listening for the things that should not be there."
body = "Low-power nodes across a reserve relay the sound of a chainsaw or a shot, the level of a drying river, the movement at a waterhole, hop by hop to a ranger post, on batteries that last a season, where pulling a wire was never an option."
