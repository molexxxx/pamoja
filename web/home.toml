[[scenario]]
key = "arm"
group = "robotics"
tab = "Arm"
eyebrow = "Robot arm · pick and place"
title = "Reach the point. Solve the angles. Respect the limits."
body = "A two-link arm solves its own inverse kinematics to land its tip on a moving target, elbow up or down, while forward kinematics draw the linkage and confirm the reach. The same arm takes a ROS 2 trajectory action from any controller on the bus."
crates = ["pamoja-kit", "pamoja-ros2"]
