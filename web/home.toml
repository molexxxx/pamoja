# The front page's data: what the hero says, the nine scenarios the consoles play, the
# backing tiers and uplinks, and the roadmap tracks. `cargo xtask site` renders it and
# fails when a scenario names a crate that is not a library crate, when a scenario has no
# console to play it, or when a roadmap tag marked as shipping names a crate that does not
# exist or one marked as planned names a crate that does. A body may carry inline HTML.

[hero]
eyebrow = "an open SDK for IoT, robotics, and drones"
title = ["One core.", "Every language.", "For the devices that", "change lives."]
lead = "pamoja runs on a two-dollar microcontroller, on a solar panel, over an intermittent radio link, so connected devices can reach the farms, clinics, and disaster zones that every other stack quietly leaves out."

# Where it runs: six field scenarios and three robots, each played by a console in
# web/js/consoles.js under the same key.

[[scenario]]
key = "farm"
group = "field"
tab = "Farm"
eyebrow = "Smallholder farms · East Africa"
title = "Water, only when the soil asks for it."
body = "A drip controller reads soil moisture from RS485 probes down a long cable, watches a well's level, and opens the valve only when it should, then duty-cycles back to sleep on a small solar panel until the next cycle. One node, a whole season, unattended."
accent = "teal"
crates = ["pamoja-modbus", "pamoja-lora", "pamoja-kit", "pamoja-power", "pamoja-sync", "pamoja-profile"]

[[scenario]]
key = "clinic"
group = "field"
tab = "Clinic"
eyebrow = "Rural clinics · the last mile"
title = "A health post that keeps watch when no one can."
body = "A solar-run clinic tracks the things it cannot afford to lose, the power to the ward, the oxygen on the shelf, the cold chain for medicines, and writes each reading into a tamper-evident log. Drop the link for days and nothing is lost; when it returns, the record uploads intact."
accent = "amber"
crates = ["pamoja-telemetry", "pamoja-security", "pamoja-audit", "pamoja-sync", "pamoja-power", "pamoja-profile"]

[[scenario]]
key = "water"
group = "field"
tab = "Water"
eyebrow = "Clean water · every drop counted"
title = "The handpump that says when it is failing."
body = "A sensor on the well watches the water level and the flow through the pump, logging every draw, so a community, and the people who fund the repair, can see a pump weakening before it fails, not weeks after the queue has already given up on it."
accent = "sky"
crates = ["pamoja-modbus", "pamoja-kit", "pamoja-audit", "pamoja-sync", "pamoja-lora", "pamoja-profile"]

[[scenario]]
key = "conservation"
group = "field"
tab = "Reserve"
eyebrow = "Conservation · eyes on the wild"
title = "Listening for the things that should not be there."
body = "Low-power nodes across a reserve relay the sound of a chainsaw or a shot, the level of a drying river, the movement at a waterhole, hop by hop to a ranger post, on batteries that last a season, where pulling a wire was never an option."
accent = "forest"
crates = ["pamoja-mesh", "pamoja-routing", "pamoja-lora", "pamoja-telemetry", "pamoja-power", "pamoja-codec"]

[[scenario]]
key = "village"
group = "field"
tab = "Village"
eyebrow = "Off-grid · by design"
title = "No tower. The village is its own network."
body = "Nodes form a mesh, each relaying for the next, flooding a message across the valley exactly once, then learning cheaper routes from the traffic they overhear, so the airtime and battery that blind flooding wastes is saved for the messages that matter."
accent = "teal"
crates = ["pamoja-mesh", "pamoja-routing", "pamoja-lora", "pamoja-sync", "pamoja-codec"]

[[scenario]]
key = "storm"
group = "field"
tab = "Storm"
eyebrow = "When the grid goes dark"
title = "The storm takes the towers. The mesh keeps talking."
body = "A typhoon makes landfall and the cell network goes with it. Along the coast, battery nodes relay hop by hop to a gateway that still holds a satellite uplink, carrying the one thing that matters in the first hours: where people are, and who needs help."
accent = "coral"
crates = ["pamoja-mesh", "pamoja-routing", "pamoja-lorawan", "pamoja-telemetry", "pamoja-power"]

[[scenario]]
key = "robot"
group = "robotics"
tab = "Rover"
eyebrow = "Mobile rover · waypoint patrol"
title = "Follow the path. Watch the wheels. Hold on obstacle."
body = "The rover chases a carrot along its route while odometry turns wheel motion into a live pose, with no GPS. A watchdog and an obstacle stop cut motion in milliseconds, and every <code>cmd_vel</code> leaves as a ROS 2 Twist on a Zenoh key any robot on the fleet already understands."
accent = "coral"
crates = ["pamoja-kit", "pamoja-ros2", "pamoja-zenoh", "pamoja-sim"]

[[scenario]]
key = "arm"
group = "robotics"
tab = "Arm"
eyebrow = "Robot arm · pick and place"
title = "Reach the point. Solve the angles. Respect the limits."
body = "A two-link arm solves its own inverse kinematics to land its tip on a moving target, elbow up or down, while forward kinematics draw the linkage and confirm the reach. The same arm takes a ROS 2 trajectory action from any controller on the bus."
accent = "amber"
crates = ["pamoja-kit", "pamoja-ros2"]

[[scenario]]
key = "fleet"
group = "robotics"
tab = "Fleet"
eyebrow = "Fleet · one bus, many robots"
title = "Many robots. One key expression."
body = "A single Zenoh key expression subscribes to every robot's <code>cmd_vel</code> at once, routerless, and one service flips them all into a mode together. Each robot can be the real thing or a pure-software twin, so the whole fleet is testable with no hardware."
accent = "sky"
crates = ["pamoja-zenoh", "pamoja-ros2", "pamoja-sim", "pamoja-kit"]

