[package]
name = "board-rp2040"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"
description = "The first program on a Raspberry Pi Pico: a BME280 on I2C0, read through pamoja, reported over UART0."

[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
embedded-alloc = "0.5"
embedded-hal = "1.0"
panic-halt = "0.2"
rp2040-boot2 = "0.3"
rp2040-hal = { version = "0.12", features = ["rt", "critical-section-impl"] }
pamoja-core = { path = "../../../crates/pamoja-core", default-features = false }
pamoja-hal = { path = "../../../crates/pamoja-hal", default-features = false }
pamoja-sensors = { path = "../../../crates/pamoja-sensors" }

[profile.release]
codegen-units = 1
debug = true
lto = true
opt-level = "s"

[workspace]
