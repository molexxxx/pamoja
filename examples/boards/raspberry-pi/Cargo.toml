[package]
name = "board-raspberry-pi"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"
description = "The first program on a Raspberry Pi: a BME280 on the header's I2C bus, read through pamoja."

[dependencies]
pamoja-core = { path = "../../../crates/pamoja-core" }
pamoja-hal = { path = "../../../crates/pamoja-hal", features = ["linux"] }
pamoja-sensors = { path = "../../../crates/pamoja-sensors", features = ["std"] }

[workspace]
