[package]
name = "board-esp32c3"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"
description = "Programs for an ESP32-C3: a BME280 on I2C0, and a thermostat that decides on the chip and switches a relay on a GPIO line."

[dependencies]
embedded-hal = "1.0"
esp-alloc = { version = "0.11", features = ["esp32c3"] }
esp-hal = { version = "1.2", features = ["esp32c3"] }
esp-println = { version = "0.18", features = ["esp32c3"] }
pamoja-core = { path = "../../../crates/pamoja-core", default-features = false }
pamoja-gpio = { path = "../../../crates/pamoja-gpio" }
pamoja-hal = { path = "../../../crates/pamoja-hal", default-features = false }
pamoja-kit = { path = "../../../crates/pamoja-kit", default-features = false }
pamoja-sensors = { path = "../../../crates/pamoja-sensors" }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = true
lto = "fat"
opt-level = "s"

[workspace]
