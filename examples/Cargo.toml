[package]
name = "pamoja-examples"
description = "Runnable examples composing the pamoja crates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[example]]
name = "store_and_forward"
path = "store_and_forward.rs"

[[example]]
name = "device_profile"
path = "device_profile.rs"

[[example]]
name = "degraded_link"
path = "degraded_link.rs"

[[example]]
name = "signed_telemetry"
path = "signed_telemetry.rs"

[[example]]
name = "signed_audit"
path = "signed_audit.rs"

[[example]]
name = "batched_telemetry"
path = "batched_telemetry.rs"

[[example]]
name = "telemetry"
path = "telemetry.rs"

[[example]]
name = "lora_budget"
path = "lora_budget.rs"

[[example]]
name = "conformance"
path = "conformance.rs"

[[example]]
name = "robot_waypoint"
path = "robot_waypoint.rs"

[[example]]
name = "mavlink_sitl"
path = "mavlink_sitl.rs"

[[test]]
name = "conformance"
path = "tests/conformance.rs"

[[test]]
name = "degraded_link"
path = "tests/degraded_link.rs"

[dependencies]
pamoja-core = { workspace = true }
pamoja-codec = { path = "../crates/pamoja-codec" }
pamoja-kit = { path = "../crates/pamoja-kit" }
pamoja-ros2 = { path = "../crates/pamoja-ros2" }
pamoja-sync = { path = "../crates/pamoja-sync" }
pamoja-loopback = { path = "../crates/pamoja-loopback" }
pamoja-power = { path = "../crates/pamoja-power" }
pamoja-profile = { path = "../crates/pamoja-profile" }
pamoja-sim = { path = "../crates/pamoja-sim" }
pamoja-security = { path = "../crates/pamoja-security" }
pamoja-update = { path = "../crates/pamoja-update" }
pamoja-audit = { path = "../crates/pamoja-audit" }
pamoja-telemetry = { path = "../crates/pamoja-telemetry" }
pamoja-lora = { path = "../crates/pamoja-lora" }
pamoja-lorawan = { path = "../crates/pamoja-lorawan" }
pamoja-mesh = { path = "../crates/pamoja-mesh", features = ["alloc"] }
pamoja-routing = { path = "../crates/pamoja-routing", features = ["alloc"] }
pamoja-serial = { path = "../crates/pamoja-serial" }
pamoja-modbus = { path = "../crates/pamoja-modbus" }
pamoja-can = { path = "../crates/pamoja-can" }
pamoja-gpio = { path = "../crates/pamoja-gpio" }
pamoja-sensors = { path = "../crates/pamoja-sensors" }
pamoja-actuators = { path = "../crates/pamoja-actuators" }
pamoja-mavlink = { path = "../crates/pamoja-mavlink" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11", default-features = false }
tokio = { version = "1", features = ["rt", "macros"] }

[[example]]
name = "signed_update"
path = "signed_update.rs"

[[example]]
name = "conformance_vectors"
path = "conformance_vectors.rs"

[lints]
workspace = true
