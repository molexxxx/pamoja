# The documentation site: the guides and the pages about the project, rendered by
# mdBook from docs/, with the four generated API references copied in beside them
# by the docs workflow. docs/SUMMARY.md is generated by `cargo xtask docs` from
# docs/capabilities.toml; edit the map, not the summary.
[book]
title = "pamoja"
description = "One memory-safe Rust core with bindings for TypeScript, Python, and C#, for IoT, robotics, and drones."
authors = ["molexxxx"]
language = "en"
src = "docs"

[build]
build-dir = "target/docs/site"

[output.html]
site-url = "/docs/"
git-repository-url = "https://github.com/molexxxx/pamoja"
edit-url-template = "https://github.com/molexxxx/pamoja/edit/main/{path}"
default-theme = "navy"
preferred-dark-theme = "navy"
# The showcase palette in mdBook's variables, generated by `cargo xtask docs`.
additional-css = ["docs/theme/mdbook.css"]

[output.html.search]
limit-results = 20
