[package]
name = "pamoja-node"
version = "0.1.14"
edition = "2021"
# napi-rs sets the real minimum supported Rust version for this binding.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/molexxxx/pamoja"
authors = ["molexxxx"]
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = ["mqtt", "security", "codec", "kit"]
# Each capability is a feature, so the binding can later be split into
# per-capability packages without reshaping the code.
mqtt = ["dep:pamoja-mqtt", "dep:tokio"]
security = ["dep:pamoja-security"]
codec = ["dep:pamoja-codec"]
kit = ["dep:pamoja-kit"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi4", "tokio_rt"] }
napi-derive = "3"
pamoja-core = { path = "../../crates/pamoja-core" }
pamoja-mqtt = { path = "../../crates/pamoja-mqtt", optional = true }
pamoja-security = { path = "../../crates/pamoja-security", optional = true }
pamoja-codec = { path = "../../crates/pamoja-codec", optional = true }
pamoja-kit = { path = "../../crates/pamoja-kit", optional = true }
tokio = { version = "1", default-features = false, features = ["sync"], optional = true }

[build-dependencies]
napi-build = "2"
