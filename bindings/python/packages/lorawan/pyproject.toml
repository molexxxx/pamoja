[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pamoja-lorawan"
version = "0.1.15"
description = "LoRaWAN 1.0.x MAC framing, AES-CMAC and AES encryption, and both halves of the OTAA join."
readme = "README.md"
license = { text = "MIT" }
license-files = ["LICENSE-MIT"]
requires-python = ">=3.10"
authors = [{ name = "molexxxx" }]
keywords = ["pamoja", "iot", "robotics", "lorawan"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "pamoja-native==0.1.15",
]

[project.urls]
Repository = "https://github.com/molexxxx/pamoja"
Documentation = "https://pamoja.molex.cloud/docs/guides/lorawan.html"

[tool.hatch.build.targets.wheel]
packages = ["pamoja"]
