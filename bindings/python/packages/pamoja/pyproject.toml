[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pamoja"
version = "0.2.0"
description = "The whole pamoja framework in one package: every capability of one memory-safe Rust core, behind an idiomatic Python facade, for IoT, robotics, and drones."
readme = "README.md"
license = { text = "MIT" }
license-files = ["LICENSE-MIT"]
requires-python = ">=3.10"
authors = [{ name = "molexxxx" }]
keywords = ["pamoja", "iot", "robotics", "drones", "mqtt", "embedded"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "pamoja-actuators==0.2.0",
    "pamoja-audit==0.2.0",
    "pamoja-bus==0.2.0",
    "pamoja-can==0.2.0",
    "pamoja-coap==0.2.0",
    "pamoja-codec==0.2.0",
    "pamoja-core==0.2.0",
    "pamoja-gateway==0.2.0",
    "pamoja-gpio==0.2.0",
    "pamoja-hal==0.2.0",
    "pamoja-kit==0.2.0",
    "pamoja-ladder==0.2.0",
    "pamoja-loopback==0.2.0",
    "pamoja-lora==0.2.0",
    "pamoja-lorawan==0.2.0",
    "pamoja-mavlink==0.2.0",
    "pamoja-mesh==0.2.0",
    "pamoja-modbus==0.2.0",
    "pamoja-mqtt==0.2.0",
    "pamoja-native==0.2.0",
    "pamoja-power==0.2.0",
    "pamoja-profile==0.2.0",
    "pamoja-radios==0.2.0",
    "pamoja-ros2==0.2.0",
    "pamoja-routing==0.2.0",
    "pamoja-security==0.2.0",
    "pamoja-sensors==0.2.0",
    "pamoja-serial==0.2.0",
    "pamoja-session==0.2.0",
    "pamoja-sim==0.2.0",
    "pamoja-sync==0.2.0",
    "pamoja-telemetry==0.2.0",
    "pamoja-update==0.2.0",
    "pamoja-zenoh==0.2.0",
]

[project.urls]
Repository = "https://github.com/molexxxx/pamoja"
Documentation = "https://pamoja.molex.cloud/docs/"

[tool.hatch.build.targets.wheel]
bypass-selection = true
