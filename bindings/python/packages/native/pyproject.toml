[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "pamoja-native"
version = "0.1.15"
description = "The compiled pamoja engine for Python and the generated contract every pamoja package builds on. Installed as a dependency, not directly."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "molexxxx" }]
keywords = ["iot", "robotics", "drones", "mqtt", "embedded"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Communications",
    "Topic :: System :: Hardware",
]

[project.urls]
Repository = "https://github.com/molexxxx/pamoja"

[tool.maturin]
# Mixed Rust/Python layout: the hand-written facade lives under python/, and the
# native contract is built into it as pamoja._native.
python-source = "python"
module-name = "pamoja._native"
features = ["pyo3/extension-module"]
