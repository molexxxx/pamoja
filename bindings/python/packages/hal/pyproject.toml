[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pamoja-hal"
version = "0.1.18"
description = "The embedded-hal traits every driver takes, a bit-banged 1-Wire bus, simulated parts and scripted buses that stand in for hardware, the Linux backends over i2c-dev, spidev, and the GPIO character device, one I2C bus a program and its drivers share, and delays that sleep or only count."
readme = "README.md"
license = { text = "MIT" }
license-files = ["LICENSE-MIT"]
requires-python = ">=3.10"
authors = [{ name = "molexxxx" }]
keywords = ["pamoja", "iot", "robotics", "hal"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "pamoja-native==0.1.18",
]

[project.urls]
Repository = "https://github.com/molexxxx/pamoja"
Documentation = "https://pamoja.molex.cloud/docs/guides/hal.html"

[tool.hatch.build.targets.wheel]
packages = ["pamoja"]
