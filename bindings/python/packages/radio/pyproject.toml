[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pamoja-radio"
version = "0.1.14"
description = "Radio and reach: Budgeting airtime, framing a mesh packet, routing it, and securing a LoRaWAN uplink: everything a node needs to reach a network it cannot see."
readme = "README.md"
license = { text = "MIT" }
license-files = ["LICENSE-MIT"]
requires-python = ">=3.10"
authors = [{ name = "molexxxx" }]
keywords = ["pamoja", "iot", "robotics", "radio"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "pamoja-lora==0.1.14",
    "pamoja-lorawan==0.1.14",
    "pamoja-mesh==0.1.14",
    "pamoja-routing==0.1.14",
]

[project.urls]
Repository = "https://github.com/molexxxx/pamoja"
Documentation = "https://pamoja.molex.cloud/docs/install.html"

[tool.hatch.build.targets.wheel]
packages = ["pamoja"]
