<svg xmlns="http://www.w3.org/2000/svg" width="160" height="44" viewBox="0 0 160 44" role="img" aria-label="Python reference">
  <style>
    .paper { fill: #fbfaf6; }
    .rule { stroke: #d7d4cc; }
    .band { fill: #0f5f56; }
    .ink { fill: #141414; }
    .accent { fill: #0f5f56; }
    .accent-rule { stroke: rgba(15, 95, 86, 0.45); }
    .tint { fill: rgba(15, 95, 86, 0.1); }
    .s-accent { stroke: #0f5f56; }
    .on-band { fill: #ffffff; }
    .s-on-band { stroke: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .paper { fill: #191a17; }
      .rule { stroke: #3a3b35; }
      .band { fill: #0d4d46; }
      .ink { fill: #eae8e1; }
      .accent { fill: #5ec6b0; }
      .accent-rule { stroke: rgba(94, 198, 176, 0.45); }
      .tint { fill: rgba(94, 198, 176, 0.1); }
      .s-accent { stroke: #5ec6b0; }
    }
  </style>
  <rect x="0.5" y="9.5" width="159" height="25" rx="2" class="tint accent-rule" stroke-width="1"/>
  <rect x="11" y="19.5" width="5" height="5" class="accent"/>
  <text x="24" y="22" dominant-baseline="central" font-family="Segoe UI, Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.8" class="accent">PYTHON REFERENCE</text>
</svg>
