<svg xmlns="http://www.w3.org/2000/svg" width="160" height="44" viewBox="0 0 160 44" role="img" aria-label="read the guide">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc85a"/>
      <stop offset="0.42" stop-color="#ffb627"/>
      <stop offset="1" stop-color="#f26a4b"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.10 0;0.10 0;-0.10 0" dur="11s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#0a1322" stop-opacity="0.22"/>
    </linearGradient>
    <filter id="lift" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="6.5" flood-color="#f26a4b" flood-opacity="0.34"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#7a2c14" flood-opacity="0.22"/>
    </filter>
  </defs>
  <g filter="url(#lift)">
    <rect x="0.5" y="2.5" width="159" height="35" rx="10" fill="url(#face)"/>
    <rect x="0.5" y="2.5" width="159" height="35" rx="10" fill="none" stroke="url(#edge)" stroke-width="1"/>
  </g>
  <text x="80" y="20" dominant-baseline="central" text-anchor="middle" font-family="Segoe UI, Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" letter-spacing="0.2" fill="#2a1606">read the guide<tspan font-size="13" fill-opacity="0.55"> ↗</tspan></text>
</svg>
