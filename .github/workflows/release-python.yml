name: release-python

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, with or without a leading v.
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    uses: ./.github/workflows/release-preflight.yml
    with:
      version: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}

  build:
    name: wheels ${{ matrix.target }}
    runs-on: ${{ matrix.host }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Native ARM64 runner: ring's ARM assembly does not cross-compile in the
          # GCC manylinux image, so build this wheel natively instead.
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          # Cross-compiled on Apple Silicon: scarce macos-13 Intel runners sit
          # unallocated for minutes and stall the whole release.
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --manifest-path bindings/python/packages/native/Cargo.toml
          manylinux: auto
          sccache: "true"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: sdist
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path bindings/python/packages/native/Cargo.toml

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  pure:
    name: pure packages
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # pamoja-core, every pamoja-<capability>, and the pamoja metapackage are pure
      # Python: one universal wheel and one sdist each.
      - name: Build every pure package
        working-directory: bindings/python
        run: |
          pip install build
          for package in $(find packages -mindepth 1 -maxdepth 1 -type d ! -name native); do
            python -m build --outdir dist "$package"
          done

      - name: Upload the pure packages
        uses: actions/upload-artifact@v7
        with:
          name: wheels-pure
          path: |
            bindings/python/dist/*.whl
            bindings/python/dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: [build, sdist, pure]
    runs-on: ubuntu-latest
    steps:
      - name: Download wheel and sdist artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # PyPI caps how many new projects an account may create in a window, and a release
      # that introduces a package per capability runs into it. Uploading the whole
      # directory in one call stops at the first refusal, which strands every file behind
      # it in the list, including existing projects that were never rate-limited. Each
      # file goes on its own so a refusal costs only that file, and the check below says
      # what is still missing so a rerun is an informed step rather than a guess.
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PIP_TOKEN }}
        run: |
          python -m pip install --quiet twine
          for file in dist/*; do
            twine upload --skip-existing --non-interactive "$file" || true
          done

      - name: Every distribution is on PyPI at this version
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
        run: |
          python - "${VERSION#v}" <<'CHECK'
          import json, pathlib, sys, urllib.error, urllib.request

          version = sys.argv[1]
          names = set()
          for path in pathlib.Path("dist").iterdir():
              stem = path.name.split("-0.")[0] if "-0." in path.name else path.stem
              names.add(stem.replace("_", "-"))

          missing = []
          for name in sorted(names):
              url = f"https://pypi.org/pypi/{name}/{version}/json"
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      json.load(response)
              except urllib.error.HTTPError:
                  missing.append(name)

          print(f"on PyPI at {version}: {len(names) - len(missing)} of {len(names)}")
          for name in missing:
              print(f"  missing: {name}")
          if missing:
              print(
                  "::error::PyPI is rate-limiting new projects. Re-run this job; "
                  "uploads already made are skipped."
              )
              sys.exit(1)
          CHECK
