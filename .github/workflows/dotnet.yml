name: dotnet

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

jobs:
  build:
    name: dotnet (build, smoke, guides)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ffi-${{ hashFiles('**/Cargo.toml') }}

      - name: Build the native FFI library and regenerate the C header
        run: cargo build -p pamoja-ffi --release

      - name: Check the generated header is in sync with the Rust source
        run: |
          if ! git diff --exit-code -- crates/pamoja-ffi/include/pamoja.h; then
            echo "::error::Generated header is stale. Run 'cargo build -p pamoja-ffi' and commit crates/pamoja-ffi/include/pamoja.h."
            exit 1
          fi

      - name: Build the .NET binding
        run: dotnet build bindings/dotnet/Pamoja.sln -c Release

      - name: Start an MQTT broker for the guide examples
        run: |
          printf 'listener 1883 0.0.0.0\nallow_anonymous true\n' > /tmp/mosquitto.conf
          docker run -d --name pamoja-broker -p 1883:1883 \
            -v /tmp/mosquitto.conf:/mosquitto/config/mosquitto.conf \
            eclipse-mosquitto:2
          for _ in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/1883) 2>/dev/null; then exit 0; fi
            sleep 1
          done
          echo "the broker never came up" >&2
          exit 1

      - name: Smoke test
        run: dotnet run --project bindings/dotnet/tests/Pamoja.Smoke -c Release

      # The C# examples the documentation site shows are spliced from this project.
      - name: Guide examples
        run: dotnet run --project bindings/dotnet/samples/Pamoja.Guides -c Release
