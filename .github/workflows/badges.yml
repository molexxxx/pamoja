name: badges

on:
  workflow_dispatch:
  workflow_run:
    workflows: [ci]
    types: [completed]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger badge refresh in molexxxx/molexxxx
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: gh api repos/molexxxx/molexxxx/dispatches -f event_type=refresh-badges
