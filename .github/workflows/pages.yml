name: Deploy showcase to Pages

# Publishes the static showcase in web/ to GitHub Pages, and bundles the local-first
# dashboard demo at /dashboard. The dashboard is a serverless build: when no device
# answers GET /state it loads the mock snapshots generated here (state.<scenario>.json),
# so the whole UI runs with no backend. Set the Pages source to "GitHub Actions" once
# (Settings -> Pages -> Build and deployment -> Source).
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'crates/pamoja-dashboard/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deployments: allow one at a time and let an in-progress production
# deployment finish rather than cancelling it, which is what leaves the Pages
# environment stuck and fails later runs with "deployment failed, try again later".
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-pages-cargo-${{ hashFiles('**/Cargo.toml') }}
      - name: Assemble site (showcase at root, dashboard demo at /dashboard)
        run: |
          mkdir -p dist/dashboard
          cp -r web/. dist/
          cp -r crates/pamoja-dashboard/web/. dist/dashboard/
          cargo run -p pamoja-dashboard --features mock --example snapshot -- dist/dashboard
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
