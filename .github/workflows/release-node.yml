name: release-node

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, with or without a leading v.
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    uses: ./.github/workflows/release-preflight.yml
    with:
      version: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}

  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.host }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
          # Cross-compiled on Apple Silicon: scarce macos-13 Intel runners sit
          # unallocated for minutes and stall the whole release.
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        working-directory: bindings/node
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      # napi build --cross-compile drives cargo-zigbuild for non-Windows targets.
      - name: Setup zig for cross compilation
        if: matrix.cross
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install dependencies
        run: npm install

      - name: Build native addon
        run: npm run build:native -- --target ${{ matrix.target }} ${{ matrix.cross && '--cross-compile' || '' }}

      - name: Upload addon artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.target }}
          path: bindings/node/packages/native/*.node
          if-no-files-found: error

  publish:
    name: publish to npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: bindings/node
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install

      - name: Download addon artifacts
        uses: actions/download-artifact@v8
        with:
          path: bindings/node/artifacts

      - name: Move addons into the platform packages
        run: npx napi artifacts --output-dir artifacts --package-json-path packages/native/package.json --npm-dir packages/native/npm

      # The facades are TypeScript and dist/ is not in the repository, so without this the
      # tarballs carry package.json, a README and a licence and no code at all.
      - name: Build the facades
        run: npm run build:facade

      # npm drops a `files` entry that is not on disk rather than failing, so an unbuilt
      # facade publishes as a three-file package that installs and then cannot be required.
      - name: Every package carries the entry point it declares
        run: npm run check:packaging

      # pre-publish publishes @pamoja/native platform packages and pins them in its
      # manifest; the workspace publish then covers @pamoja/native, @pamoja/core, every capability
      # package, and the pamoja bundle.
      - name: Publish the platform packages, then every workspace package
        run: |
          npx napi pre-publish -t npm --package-json-path packages/native/package.json --npm-dir packages/native/npm
          npm publish --workspaces --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
