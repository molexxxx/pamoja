name: node

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

jobs:
  build:
    name: node (build, smoke, guides)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/node
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build native addon and facade
        run: npm run build

      - name: Check generated bindings are in sync with the Rust source
        run: |
          if ! git diff --exit-code -- packages/native/index.js packages/native/index.d.ts; then
            echo "::error::Generated bindings are stale. Run 'npm run build' in bindings/node and commit packages/native/index.js and packages/native/index.d.ts."
            exit 1
          fi

      - name: Start an MQTT broker for the guide examples
        run: |
          printf 'listener 1883 0.0.0.0\nallow_anonymous true\n' > /tmp/mosquitto.conf
          docker run -d --name pamoja-broker -p 1883:1883 \
            -v /tmp/mosquitto.conf:/mosquitto/config/mosquitto.conf \
            eclipse-mosquitto:2
          for _ in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/1883) 2>/dev/null; then exit 0; fi
            sleep 1
          done
          echo "the broker never came up" >&2
          exit 1

      - name: Smoke, conformance, and guide tests
        run: npm test
