name: node

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

jobs:
  build:
    name: build and smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/node
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build native addon and facade
        run: npm run build

      - name: Check generated bindings are in sync with the Rust source
        run: |
          if ! git diff --exit-code -- packages/native/index.js packages/native/index.d.ts; then
            echo "::error::Generated bindings are stale. Run 'npm run build' in bindings/node and commit packages/native/index.js and packages/native/index.d.ts."
            exit 1
          fi

      # The MQTT guide example talks to a real broker on 1883.
      - name: Start an MQTT broker
        run: docker run -d --rm -p 1883:1883 eclipse-mosquitto:2 mosquitto -c /mosquitto-no-auth.conf

      - name: Smoke, conformance, and guide tests
        run: npm test
