name: docs

# Builds the documentation site into one tree: the guides with mdBook and the four
# generated API references beside them. Runs on every pull request, so a stale
# generated region, a capability map that disagrees with the code, or a rustdoc
# warning fails before merge; pages.yml calls it to publish the same tree at /docs.

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  site:
    name: docs (site)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-docs-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Install mdBook
        uses: taiki-e/install-action@v2.87.1
        with:
          tool: mdbook@0.5.4

      # The crate READMEs, the site navigation, the capability tables, and every spliced
      # example must match the code they are generated from.
      - name: Generated docs in sync with the code
        run: cargo run -p xtask -- docs --check

      - name: Build the guides
        run: mdbook build

      - name: Rust reference
        env:
          RUSTDOCFLAGS: -D warnings --html-in-header ${{ github.workspace }}/docs/theme/rustdoc.html
        run: |
          cargo doc --workspace --no-deps --exclude xtask --exclude pamoja-examples
          mkdir -p target/docs/site/reference
          cp -r target/doc target/docs/site/reference/rust

      # typedoc documents each package against the committed napi-rs contract, so no
      # native build is needed, only the facade build that gives the packages their
      # declarations; it pins its own TypeScript under bindings/node/docs.
      - name: TypeScript reference
        working-directory: bindings/node
        run: |
          npm ci
          npm run build:facade
          cd docs
          npm ci
          npx typedoc

      # pdoc imports the packages, so the engine is built and every pure package installed first.
      - name: Python reference
        working-directory: bindings/python
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install maturin pdoc==16.0
          maturin develop -m packages/native/Cargo.toml
          pip install $(find packages -mindepth 1 -maxdepth 1 -type d ! -name native)
          pdoc pamoja '!pamoja._native' -o ../../target/docs/site/reference/python --docformat restructuredtext --template-directory ../../docs/theme/pdoc

      - name: .NET reference
        run: |
          dotnet tool install -g docfx --version 2.78.5
          docfx bindings/dotnet/docs/docfx.json

      - name: Upload the site
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: target/docs/site
          if-no-files-found: error
