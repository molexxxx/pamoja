# Dev-dependencies (test brokers, harnesses) never reach a shipped artifact, so
# only the graph a user actually installs is audited.
[graph]
exclude-dev = true

[advisories]
version = 2
yanked = "deny"
# spin 0.9.8 was yanked by its maintainer with no RUSTSEC advisory and no
# security notice; rumqttc 0.25.1 (latest) pins flume ^0.11, which pins spin
# ^0.9.8, so no non-yanked 0.9.x satisfies the graph until upstream moves.
ignore = ["spin@0.9.8"]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

# cbindgen generates pamoja.h at build time; it is a build tool and none of its
# MPL-2.0 code is linked into any shipped artifact.
exceptions = [{ allow = ["MPL-2.0"], crate = "cbindgen" }]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"